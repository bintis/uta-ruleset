<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071317">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src ws: wss:; img-src data:">
<title>uta! remote</title>
<style>
:root{--bg:#071317;--panel:#0d1d22;--panel2:#11272d;--line:#25434b;--text:#f4fbfc;--muted:#91aab0;--cyan:#65d6e5;--gold:#f0c45c;--danger:#ff6b6b;--ok:#62db9a;--radius:14px;--header:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 12% -15%,#174954 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.4 "Trebuchet MS","Avenir Next",sans-serif}
button,input,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#13272d;color:var(--text);font-weight:800;padding:8px 12px;cursor:pointer}button:active{transform:scale(.97);border-color:var(--cyan)}button:disabled{opacity:.38;cursor:not-allowed;transform:none}.primary{background:var(--cyan);border-color:transparent;color:#041216}.danger{color:var(--danger);border-color:#61363b}.ghost{background:transparent}.small{min-height:34px;padding:5px 9px;font-size:12px}
.app{height:100%;display:flex;flex-direction:column}.app-header{height:var(--header);flex:none;display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(7,19,23,.94);backdrop-filter:blur(14px);z-index:20}.brand{font-size:20px;font-weight:900;letter-spacing:.12em;color:var(--cyan);white-space:nowrap}.connection{min-width:0;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.connection strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--danger)}.connection.online .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}#language{margin-left:auto;max-width:92px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:7px}
.view-container{position:relative;flex:1;min-height:0;overflow:hidden}.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}.remote-view{z-index:1}.library-view{z-index:5;transform:translateX(100%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1)}.library-view.active{transform:translateX(0);visibility:visible}.scroll{flex:1;overflow-y:auto;padding:12px 12px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}.card{margin-bottom:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 8px 24px #0003}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{margin:0;font-size:17px;letter-spacing:.03em}.section-head small,.muted{color:var(--muted)}#notice{color:var(--gold);font-size:13px;margin-top:6px}.hidden{display:none!important}
.queue-cta{width:100%;margin-bottom:10px}.song-list{display:grid;gap:7px}.song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid #203a41;border-radius:11px;background:#09171b}.song-main{min-width:0}.song-title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-meta{margin-top:2px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-actions{grid-column:1/-1;display:flex;gap:5px;overflow-x:auto;padding-top:2px}.empty{padding:18px 8px;text-align:center;color:var(--muted)}
.lyrics{text-align:center;min-height:86px;display:flex;flex-direction:column;justify-content:center}#lyrics{font-size:22px;font-weight:900}#nextLyrics{margin-top:5px;color:var(--muted)}.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid button{width:100%}.metric{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.metric b{font-variant-numeric:tabular-nums}label{display:block;margin-top:10px;color:var(--muted)}label span{float:right;color:var(--text)}input[type=range]{width:100%;accent-color:var(--cyan)}
.skip-button{width:100%;margin-top:9px;border-color:#8b7038;color:var(--gold)}.mod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.mod-button{min-height:50px;justify-content:flex-start;text-align:left}.mod-button.active{border-color:var(--cyan);background:#173b43;color:var(--cyan)}.mod-acronym{display:inline-block;min-width:36px;color:var(--gold)}
.library-header{flex:none;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}.library-title{display:flex;align-items:center;gap:9px;margin-bottom:9px}.library-title h2{margin:0;font-size:18px}.search-row{display:grid;grid-template-columns:1fr auto;gap:7px}.search-row input{min-width:0;border:1px solid var(--line);border-radius:10px;background:#071317;color:var(--text);padding:11px}.library-results{flex:1;overflow-y:auto;padding:8px 10px 20px}.library-song{min-height:72px}.library-song .song-actions{grid-column:auto;padding:0}.library-song .song-actions button{white-space:nowrap}
.toast{position:fixed;z-index:100;left:50%;bottom:18px;max-width:calc(100% - 28px);transform:translate(-50%,90px);opacity:0;padding:10px 18px;border:1px solid var(--cyan);border-radius:999px;background:#102329;color:var(--text);font-weight:800;transition:.22s}.toast.show{transform:translate(-50%,0);opacity:1}.toast.error{border-color:var(--danger);color:var(--danger)}
@media(min-width:780px){.view-container{display:flex}.remote-view{position:relative;width:410px;flex:none;border-right:1px solid var(--line)}.library-view{position:relative;flex:1;transform:none!important;visibility:visible!important}.mobile-only{display:none!important}.library-results{padding:12px 18px 24px}.app-header{padding-inline:20px}}
@media(max-width:480px){.brand{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.song{padding:9px}.scroll{padding-inline:9px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">UTA!</div>
    <div id="status" class="connection"><i class="dot"></i><strong id="statusText">Connecting…</strong><span id="role"></span></div>
    <select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select>
  </header>
  <div class="view-container">
    <section id="remoteView" class="view remote-view">
      <div class="scroll">
        <div class="card">
          <div class="section-head"><h2 data-i18n="queue">Queue</h2><small id="queueCount">0</small></div>
          <button id="openLibrary" class="primary queue-cta" data-i18n="addSongs">Add songs</button>
          <div id="queueList" class="song-list"></div>
          <button id="queueClear" class="control danger" style="width:100%;margin-top:10px" data-i18n="clearQueue">Clear queue</button>
        </div>
        <div id="gameplayUnavailable" class="card empty hidden"></div>
        <div class="card lyrics"><div id="lyrics">—</div><div id="nextLyrics"></div></div>
        <div class="card">
          <div class="timeline"><span id="timeNow">0:00</span><input class="gameplay-control" id="seek" type="range" min="0" max="1" step="100" value="0"><span id="timeEnd">0:00</span></div>
          <div class="grid" style="margin-top:10px"><button class="control gameplay-control" data-command="seekRelative" data-value="-10000">−10s</button><button class="control gameplay-control primary" id="togglePlayback" data-command="togglePlayback">▶ / ❚❚</button><button class="control gameplay-control" data-command="seekRelative" data-value="10000">+10s</button></div>
          <button id="skipCurrent" class="control gameplay-control skip-button" data-i18n="skipCurrent">End song and show results</button>
        </div>
        <div class="card">
          <div class="grid"><button class="control gameplay-control" data-command="previousPhrase" data-i18n="previous">Previous</button><button class="control gameplay-control" data-command="retryPhrase" data-i18n="retry">Retry</button><button class="control gameplay-control" data-command="nextPhrase" data-i18n="next">Next</button><button class="control gameplay-control" data-command="setLoopA">A</button><button class="control gameplay-control" data-command="setLoopB">B</button><button class="control gameplay-control" data-command="clearLoop" data-i18n="clearLoop">Clear loop</button></div>
          <label><span data-i18n="speed">Speed</span><span id="speedValue">100%</span><input class="control gameplay-control" id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1"></label>
          <label><input class="control gameplay-control" id="loopPhrase" type="checkbox"> <span data-i18n="loopPhrase">Loop current phrase</span></label>
        </div>
        <div class="card"><div class="metric"><span data-i18n="score">Score</span><b id="score">0.00</b></div><div class="metric"><span data-i18n="pitch">Detected pitch</span><b id="pitch">—</b></div><div class="metric"><span data-i18n="similarity">Similarity</span><b id="similarity">0%</b></div><div class="metric"><span data-i18n="phrase">Phrase</span><b id="phrase">—</b></div><div class="metric"><span data-i18n="loopState">Loop</span><b id="loopState">—</b></div></div>
        <div class="card"><div class="section-head"><h2 data-i18n="mods">Next-song Mods</h2><small data-i18n="modsHint">applies next play</small></div><div id="modList" class="mod-grid"></div></div>
        <div class="card">
          <label>BGM <span id="bgmValue">100%</span><input class="control gameplay-control mixer" id="bgmVolume" type="range" min="0" max="1" step="0.01" value="1"></label>
          <label><span data-i18n="vocals">Original vocals</span><span id="vocalsValue">55%</span><input class="control gameplay-control mixer" id="vocalsVolume" type="range" min="0" max="1" step="0.01" value=".55"></label>
          <label><span data-i18n="monitor">Mic monitor</span><span id="monitorValue">35%</span><input class="control gameplay-control mixer" id="monitorVolume" type="range" min="0" max="1" step="0.01" value=".35"></label>
          <label><span data-i18n="transpose">Transpose</span><span id="transposeValue">0</span><input class="control gameplay-control mixer" id="transpose" type="range" min="-6" max="6" step="1" value="0"></label>
          <div class="grid two" style="margin-top:12px"><label><input class="control gameplay-control" id="octaveFold" type="checkbox"> OCT</label><label><input class="control gameplay-control" id="originalVocals" type="checkbox"> VOX</label></div>
        </div>
        <div class="card">
          <label><span data-i18n="micLatency">Microphone latency</span><span id="microphoneLatencyValue">0 ms</span><input class="control gameplay-control mixer" id="microphoneLatency" type="range" min="-500" max="1000" step="1" value="0"></label>
          <label><span data-i18n="accompanimentLatency">Accompaniment latency</span><span id="accompanimentLatencyValue">0 ms</span><input class="control gameplay-control mixer" id="accompanimentLatency" type="range" min="-500" max="1000" step="1" value="0"></label>
          <label><span data-i18n="lyricsLatency">Lyrics latency</span><span id="lyricsLatencyValue">0 ms</span><input class="control gameplay-control mixer" id="lyricsLatency" type="range" min="-500" max="1000" step="1" value="0"></label>
        </div>
        <div class="card"><button id="disconnect" class="danger" style="width:100%" data-i18n="disconnect">Disconnect and revoke</button><p class="muted" data-i18n="privacy">Local-network only.</p><div id="notice"></div></div>
      </div>
    </section>
    <section id="libraryView" class="view library-view">
      <div class="library-header">
        <div class="library-title"><button id="closeLibrary" class="ghost small mobile-only" data-i18n="back">Back</button><h2 data-i18n="library">Song library</h2><small id="libraryStatus" class="muted"></small></div>
        <div class="search-row"><input id="librarySearch" type="search" maxlength="120" autocomplete="off" data-i18n-placeholder="searchSongs" placeholder="Search title, artist, difficulty…"><button id="librarySearchButton" class="primary" data-i18n="search">Search</button></div>
      </div>
      <div id="libraryResults" class="library-results song-list"></div>
    </section>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const WASM_BASE64='__UTA_WASM_BASE64__';
const text={
  en:{queue:'Queue',addSongs:'Add songs',clearQueue:'Clear queue',library:'Song library',back:'Back',search:'Search',searchSongs:'Search title, artist, difficulty…',add:'Add',addNext:'Add next',playNow:'Play',remove:'Remove',moveUp:'Up',moveDown:'Down',moveTop:'Top',moveBottom:'Bottom',skipCurrent:'End song and show results',ending:'Ending current song…',mods:'Next-song Mods',modsHint:'applies next play',modUpdated:'Mod selection updated',noSongs:'No matching Uta songs.',emptyQueue:'Queue is empty. Add songs from the library.',results:'results',queued:'Added to queue',requestFailed:'Request failed',previous:'Previous',retry:'Retry',next:'Next',clearLoop:'Clear loop',speed:'Speed',loopPhrase:'Loop current phrase',score:'Score',pitch:'Detected pitch',similarity:'Similarity',phrase:'Phrase',loopState:'Loop',vocals:'Original vocals',monitor:'Mic monitor',transpose:'Transpose',micLatency:'Microphone latency',accompanimentLatency:'Accompaniment latency',lyricsLatency:'Lyrics latency',disconnect:'Disconnect and revoke',privacy:'Local-network only. The server can remain active between Uta songs.',connecting:'Connecting…',connected:'Connected',spectator:'spectator',controller:'controller',closed:'Disconnected',reconnecting:'Reconnecting…'},
  zh:{queue:'队列',addSongs:'添加歌曲',clearQueue:'清空队列',library:'曲库',back:'返回',search:'搜索',searchSongs:'搜索标题、艺术家、难度…',add:'点歌',addNext:'插到下一首',playNow:'播放',remove:'删除',moveUp:'上移',moveDown:'下移',moveTop:'置顶',moveBottom:'置底',skipCurrent:'结束本局并显示结算',ending:'正在结束当前歌曲…',mods:'下一首 Mod',modsHint:'下一局生效',modUpdated:'Mod 选择已更新',noSongs:'没有匹配的 Uta 歌曲。',emptyQueue:'队列为空，请从曲库添加歌曲。',results:'条结果',queued:'已加入队列',requestFailed:'操作失败',previous:'上一句',retry:'重唱本句',next:'下一句',clearLoop:'清除循环',speed:'速度',loopPhrase:'循环当前句',score:'分数',pitch:'检测音高',similarity:'相似度',phrase:'段落',loopState:'循环',vocals:'原唱',monitor:'麦克风监听',transpose:'移调',micLatency:'麦克风延迟',accompanimentLatency:'伴奏延迟',lyricsLatency:'歌词延迟',disconnect:'断开并撤销',privacy:'仅限本地网络。Server 可在 Uta 歌曲之间继续运行。',connecting:'正在连接…',connected:'已连接',spectator:'旁观',controller:'控制',closed:'已断开',reconnecting:'正在重连…'},
  ja:{queue:'キュー',addSongs:'曲を追加',clearQueue:'キューをクリア',library:'曲ライブラリ',back:'戻る',search:'検索',searchSongs:'タイトル、アーティスト、難易度を検索…',add:'追加',addNext:'次に追加',playNow:'再生',remove:'削除',moveUp:'上へ',moveDown:'下へ',moveTop:'先頭',moveBottom:'末尾',skipCurrent:'演奏を終了してリザルトへ',mods:'次の曲の Mod',modsHint:'次回プレイから適用',modUpdated:'Mod を更新しました',noSongs:'一致する Uta 曲がありません。',emptyQueue:'キューは空です。曲ライブラリから追加してください。',results:'件',queued:'キューに追加しました',requestFailed:'操作に失敗しました',previous:'前のフレーズ',retry:'やり直す',next:'次のフレーズ',clearLoop:'ループ解除',speed:'速度',loopPhrase:'現在のフレーズをループ',score:'スコア',pitch:'検出ピッチ',similarity:'一致度',phrase:'フレーズ',loopState:'ループ',vocals:'原曲ボーカル',monitor:'マイクモニター',transpose:'キー変更',micLatency:'マイク遅延',accompanimentLatency:'伴奏遅延',lyricsLatency:'歌詞遅延',disconnect:'切断して無効化',privacy:'ローカルネットワーク専用。Server は Uta 曲の間も動作できます。',connecting:'接続中…',connected:'接続済み',spectator:'観覧',controller:'操作',closed:'切断',reconnecting:'再接続中…'}
};
let lang=sessionStorage.getItem('uta.lang')||((navigator.language||'en').startsWith('zh')?'zh':(navigator.language||'en').startsWith('ja')?'ja':'en');
const $=id=>document.getElementById(id);
function t(key){return text[lang][key]||text.en[key]||key}
function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));}
$('language').value=lang;$('language').onchange=e=>{lang=e.target.value;sessionStorage.setItem('uta.lang',lang);applyLanguage();renderQueue(lastQueue);renderLibrary(lastLibrary);renderMods(lastMods)};applyLanguage();
let wasmNext=n=>(n+1)|0;(async()=>{try{const raw=Uint8Array.from(atob(WASM_BASE64),c=>c.charCodeAt(0));const result=await WebAssembly.instantiate(raw,{});wasmNext=result.instance.exports.next_sequence}catch(error){console.warn('WASM fallback',error)}})();
const fragment=new URLSearchParams(location.hash.slice(1));let ticket=fragment.get('ticket')||'';let sessionId=sessionStorage.getItem('uta.session')||'';let secret=sessionStorage.getItem('uta.secret')||'';let sequence=Number(sessionStorage.getItem('uta.sequence')||0)|0;let socket=null,retryTimer=null,role='controller',snapshot=null,intentional=false,libraryRequestId='',hasGameplay=false,lastQueue={entries:[]},lastLibrary=[],lastMods=[],searchTimer=null,toastTimer=null;const pending=new Map();
function wsUrl(){const scheme=location.protocol==='https:'?'wss:':'ws:';const query=new URLSearchParams();if(ticket)query.set('ticket',ticket);else{query.set('session',sessionId);query.set('secret',secret)}return scheme+'//'+location.host+'/ws?'+query.toString()}
function setStatus(key,online=false){$('status').classList.toggle('online',online);$('statusText').textContent=t(key);$('role').textContent=role?t(role):''}
function showToast(message,error=false){const toast=$('toast');toast.textContent=message;toast.classList.toggle('error',error);toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
function send(command,value,enabled,textValue,requestId){if(!socket||socket.readyState!==WebSocket.OPEN)return false;sequence=wasmNext(sequence)|0;if(sequence<=0)sequence=1;sessionStorage.setItem('uta.sequence',String(sequence));const message={type:'command',sequence,command};if(value!==undefined)message.value=Number(value);if(enabled!==undefined)message.enabled=!!enabled;if(textValue!==undefined)message.text=String(textValue);if(requestId!==undefined)message.requestId=String(requestId);socket.send(JSON.stringify(message));return true}
function request(command,textValue,value,successText,enabled){const requestId='action-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);pending.set(requestId,successText);if(send(command,value,enabled,textValue,requestId))return true;pending.delete(requestId);showToast(t('closed'),true);return false}
function connect(){if(!ticket&&(!sessionId||!secret)){setStatus('closed');$('notice').textContent='Missing pairing credential.';return}clearTimeout(retryTimer);intentional=false;setStatus(sessionId?'reconnecting':'connecting');socket=new WebSocket(wsUrl());socket.onmessage=event=>{let message;try{message=JSON.parse(event.data)}catch{return}if(message.type==='welcome'){sessionId=message.sessionId;secret=message.sessionSecret;role=message.role;ticket='';history.replaceState(null,'',location.pathname);sessionStorage.setItem('uta.session',sessionId);sessionStorage.setItem('uta.secret',secret);applyRole();setStatus('connected',true);render(message.snapshot);searchLibrary()}else if(message.type==='resumed'){role=message.role;applyRole();setStatus('connected',true);render(message.snapshot);searchLibrary()}else if(message.type==='state')render(message.snapshot);else if(message.type==='queue')renderQueue(message);else if(message.type==='commandResult'){if(message.requestId===libraryRequestId&&Array.isArray(message.library))renderLibrary(message.library);if(pending.has(message.requestId)){const success=pending.get(message.requestId);pending.delete(message.requestId);showToast(message.accepted?success:(message.error||t('requestFailed')),!message.accepted)}else if(!message.accepted)$('notice').textContent=message.error||t('requestFailed')}else if(message.type==='error'){$('notice').textContent=message.error||t('requestFailed');showToast(message.error||t('requestFailed'),true)}};socket.onclose=()=>{setStatus('closed');if(!intentional&&sessionId&&secret)retryTimer=setTimeout(connect,1400)};socket.onerror=()=>{}}
function applyRole(){const spectator=String(role).toLowerCase()==='spectator';document.querySelectorAll('.control').forEach(el=>el.disabled=spectator);document.querySelectorAll('.gameplay-control').forEach(el=>el.disabled=spectator||!hasGameplay);$('disconnect').disabled=false;renderQueue(lastQueue);renderLibrary(lastLibrary)}
function fmt(ms){ms=Math.max(0,Number(ms)||0);const seconds=Math.floor(ms/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
function setRange(id,value,suffix='',scale=1){const element=$(id);if(document.activeElement!==element)element.value=value;const output=$(id+'Value');if(output)output.textContent=Math.round(value*scale)+suffix}
function render(state){if(!state)return;snapshot=state;hasGameplay=!state.notice;$('gameplayUnavailable').textContent=state.notice||'';$('gameplayUnavailable').classList.toggle('hidden',hasGameplay);$('lyrics').textContent=state.currentLyrics||'—';$('nextLyrics').textContent=state.nextLyrics||'';$('timeNow').textContent=fmt(state.songTime);$('timeEnd').textContent=fmt(state.songLength);$('seek').max=Math.max(1,state.songLength||1);if(document.activeElement!==$('seek'))$('seek').value=state.songTime||0;$('togglePlayback').textContent=state.paused?'▶':'❚❚';$('score').textContent=Number(state.score||0).toFixed(2);$('pitch').textContent=state.voiceActive&&state.detectedPitchMidi!=null?Number(state.detectedPitchMidi).toFixed(1)+' MIDI':'—';$('similarity').textContent=Math.round((state.pitchSimilarity||0)*100)+'%';$('phrase').textContent=state.phraseIndex>=0?(state.phraseIndex+1)+' / '+state.phraseCount:'—';$('loopState').textContent=state.loop.currentPhrase?'phrase':((state.loop.a!=null||state.loop.b!=null)?((state.loop.a!=null?fmt(state.loop.a):'—')+' – '+(state.loop.b!=null?fmt(state.loop.b):'—')):'—');setRange('speed',state.speed||1,'%',100);setRange('bgmVolume',state.mixer.backgroundMusic,'%',100);setRange('vocalsVolume',state.mixer.originalVocals,'%',100);setRange('monitorVolume',state.mixer.microphoneMonitor,'%',100);setRange('transpose',state.mixer.transpose);setRange('microphoneLatency',state.mixer.microphoneLatency,' ms');setRange('accompanimentLatency',state.mixer.accompanimentLatency,' ms');setRange('lyricsLatency',state.mixer.lyricsLatency,' ms');if(document.activeElement!==$('loopPhrase'))$('loopPhrase').checked=!!state.loop.currentPhrase;if(document.activeElement!==$('octaveFold'))$('octaveFold').checked=!!state.mixer.octaveFold;if(document.activeElement!==$('originalVocals'))$('originalVocals').checked=!!state.mixer.originalVocalsEnabled;renderQueue({entries:state.queue||[]});renderMods(state.mods||[]);$('notice').textContent=state.notice||'';applyRole()}
function makeButton(label,action,controllerOnly=false,gameplayOnly=false){const button=document.createElement('button');button.className='small'+(controllerOnly?' control':'')+(gameplayOnly?' gameplay-control':'');button.textContent=label;button.onclick=action;button.disabled=(controllerOnly&&String(role).toLowerCase()==='spectator')||(gameplayOnly&&!hasGameplay);return button}
function songText(title,meta){const main=document.createElement('div');main.className='song-main';const titleNode=document.createElement('div');titleNode.className='song-title';titleNode.textContent=title||'—';const metaNode=document.createElement('div');metaNode.className='song-meta';metaNode.textContent=meta;main.append(titleNode,metaNode);return main}
function renderLibrary(items){lastLibrary=Array.isArray(items)?items:[];$('libraryStatus').textContent=lastLibrary.length+' '+t('results');const list=$('libraryResults');list.replaceChildren();if(!lastLibrary.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('noSongs');list.append(empty);return}for(const song of lastLibrary){const row=document.createElement('div');row.className='song library-song';row.append(songText(song.title,(song.artist||'—')+' · ['+(song.difficultyName||'—')+'] · '+fmt(song.lengthMs||0)+(song.creator?' · '+song.creator:'')));const actions=document.createElement('div');actions.className='song-actions';actions.append(makeButton(t('add'),()=>request('queueAdd',song.beatmapId,undefined,t('queued'))),makeButton(t('addNext'),()=>request('queueAddNext',song.beatmapId,undefined,t('queued')),true));row.append(actions);list.append(row)}}
function renderQueue(queue){lastQueue=queue&&Array.isArray(queue.entries)?queue:{entries:[]};const items=lastQueue.entries;$('queueCount').textContent=String(items.length);const list=$('queueList');list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('emptyQueue');list.append(empty);return}items.forEach((entry,index)=>{const row=document.createElement('div');row.className='song';row.append(songText((index+1)+'. '+(entry.title||'—'),(entry.artist||'—')+(entry.difficultyName?' · ['+entry.difficultyName+']':'')+(entry.lengthMs?' · '+fmt(entry.lengthMs):'')));const actions=document.createElement('div');actions.className='song-actions';actions.append(makeButton(t('playNow'),()=>request('queuePlayNow',entry.id,undefined,t('queued')),true,true),makeButton(t('moveTop'),()=>request('queueMoveToTop',entry.id,undefined,t('queued')),true),makeButton(t('moveUp'),()=>request('queueMove',entry.id,index-1,t('queued')),true),makeButton(t('moveDown'),()=>request('queueMove',entry.id,index+1,t('queued')),true),makeButton(t('moveBottom'),()=>request('queueMoveToBottom',entry.id,undefined,t('queued')),true),makeButton(t('remove'),()=>request('queueRemove',entry.id,undefined,t('queued')),true));row.append(actions);list.append(row)})}
function renderMods(mods){lastMods=Array.isArray(mods)?mods:[];const list=$('modList');list.replaceChildren();for(const mod of lastMods){const button=document.createElement('button');button.className='control gameplay-control mod-button'+(mod.enabled?' active':'');const acronym=document.createElement('span');acronym.className='mod-acronym';acronym.textContent=mod.acronym;const name=document.createTextNode(mod.name);button.append(acronym,name);button.disabled=String(role).toLowerCase()==='spectator'||!hasGameplay;button.onclick=()=>request('setMod',mod.acronym,undefined,t('modUpdated'),!mod.enabled);list.append(button)}}
function searchLibrary(){libraryRequestId='library-'+Date.now();$('libraryStatus').textContent='…';send('librarySearch',undefined,undefined,$('librarySearch').value,libraryRequestId)}
function openLibrary(){if(window.innerWidth<780)$('libraryView').classList.add('active');setTimeout(()=>$('librarySearch').focus(),40)}
function closeLibrary(){$('libraryView').classList.remove('active')}
document.querySelectorAll('button.control[data-command]').forEach(button=>button.onclick=()=>send(button.dataset.command,button.dataset.value));
$('seek').onchange=e=>send('seek',e.target.value);$('speed').onchange=e=>send('speed',e.target.value);$('loopPhrase').onchange=e=>send('loopPhrase',undefined,e.target.checked);$('octaveFold').onchange=e=>send('octaveFold',undefined,e.target.checked);$('originalVocals').onchange=e=>send('originalVocals',undefined,e.target.checked);
for(const id of ['bgmVolume','vocalsVolume','monitorVolume','transpose','microphoneLatency','accompanimentLatency','lyricsLatency']){$(id).oninput=e=>{const latency=id.endsWith('Latency');const scale=id==='transpose'||latency?1:100;const suffix=latency?' ms':(id==='transpose'?'':'%');$(id+'Value').textContent=Math.round(Number(e.target.value)*scale)+suffix};$(id).onchange=e=>send(id,e.target.value)}
$('openLibrary').onclick=openLibrary;$('closeLibrary').onclick=closeLibrary;$('librarySearchButton').onclick=searchLibrary;$('librarySearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchLibrary()}};$('librarySearch').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchLibrary,250)};$('queueClear').onclick=()=>request('queueClear',undefined,undefined,t('clearQueue'));$('skipCurrent').onclick=()=>{if(request('skipCurrent',undefined,undefined,t('skipCurrent')))showToast(t('ending'))};
$('disconnect').onclick=()=>{intentional=true;send('disconnect');sessionStorage.removeItem('uta.session');sessionStorage.removeItem('uta.secret');setTimeout(()=>socket&&socket.close(),100)};window.addEventListener('beforeunload',()=>{intentional=true});applyRole();connect();
</script>
</body>
