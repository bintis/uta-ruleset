  host_fill_rect(x,y,w,h,c,r){ctx.fillStyle=color(c>>>0);if(r>0&&ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}else ctx.fillRect(x,y,w,h)},
  host_stroke_rect(x,y,w,h,c,r,width){ctx.strokeStyle=color(c>>>0);ctx.lineWidth=width||1;if(r>0&&ctx.roundRect){ctx.beginPath();ctx.roundRect(x+0.5,y+0.5,Math.max(0,w-1),Math.max(0,h-1),r);ctx.stroke()}else ctx.strokeRect(x+0.5,y+0.5,Math.max(0,w-1),Math.max(0,h-1))},
  host_fill_triangle(x1,y1,x2,y2,x3,y3,c){ctx.fillStyle=color(c>>>0);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill()},
  host_fill_text(x,y,size,c,align,flags,ptr,len){ctx.fillStyle=color(c>>>0);ctx.font=(flags&1?'700 ':'400 ')+size+'px Torus,Inter,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans CJK SC",sans-serif';ctx.textAlign=align===1?'center':align===2?'right':'left';ctx.textBaseline='middle';ctx.fillText(read(ptr,len),x,y)},
  host_measure_text(size,flags,ptr,len){ctx.font=(flags&1?'700 ':'400 ')+size+'px Torus,Inter,"Segoe UI",sans-serif';return ctx.measureText(read(ptr,len)).width},
  host_clip(x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip()},
  host_unclip(){ctx.restore()},
  host_send(ptr,len){memory=wasm.memory;const payload=new Uint8Array(memory.buffer,ptr,len).slice();if(socket&&socket.readyState===1)socket.send(payload)},
  host_search(x,y,w,h,visible){if(visible){search.classList.add('on');search.style.left=x+'px';search.style.top=y+'px';search.style.width=Math.max(0,w)+'px';search.style.height=Math.max(0,h)+'px'}else{search.classList.remove('on');if(document.activeElement===search)search.blur()}},
  host_log(ptr,len){console.log('[uta]',read(ptr,len))},
  host_session(idPtr,idLen,secPtr,secLen){sessionId=read(idPtr,idLen);secret=read(secPtr,secLen);ticket='';history.replaceState(null,'',location.pathname);sessionStorage.setItem('uta.session',sessionId);sessionStorage.setItem('uta.secret',secret);if(remember){localStorage.setItem('uta.session',sessionId);localStorage.setItem('uta.secret',secret)}},
  host_seq(value){sessionStorage.setItem('uta.sequence',String(value))},
  host_remember(enabled){remember=!!enabled;localStorage.setItem('uta.remember',remember?'1':'0');if(remember){if(sessionId)localStorage.setItem('uta.session',sessionId);if(secret)localStorage.setItem('uta.secret',secret)}else{localStorage.removeItem('uta.session');localStorage.removeItem('uta.secret')}},
  host_theme(light){applyTheme(!!light)},
  host_style(style){applyStyle(style)}
};

function wsUrl(){const scheme=location.protocol==='https:'?'wss:':'ws:';const q=new URLSearchParams();if(ticket)q.set('ticket',ticket);else{q.set('session',sessionId);q.set('secret',secret)}return scheme+'//'+location.host+'/ws?'+q}
function connect(){if(!ticket&&(!sessionId||!secret)){return}clearTimeout(retryTimer);intentional=false;socket=new WebSocket(wsUrl());socket.binaryType='arraybuffer';socket.onmessage=e=>{if(!wasm)return;const bytes=typeof e.data==='string'?new TextEncoder().encode(e.data):new Uint8Array(e.data);const [ptr,len]=writeBytes(bytes);wasm.on_message(ptr,len);wasm.dealloc(ptr,len||1)};socket.onclose=()=>{if(wasm)wasm.set_closed();if(!intentional&&sessionId&&secret)retryTimer=setTimeout(connect,1400)};socket.onerror=()=>{}}

function unlock(){if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(s=>wake=s).catch(()=>{})}
function ptr(kind,e){const r=canvas.getBoundingClientRect();const t=e.changedTouches?e.changedTouches[0]:e;if(wasm)wasm.pointer(kind,t.clientX-r.left,t.clientY-r.top)}

(async()=>{
  const raw=Uint8Array.from(atob(WASM_BASE64),c=>c.charCodeAt(0));
  const result=await WebAssembly.instantiate(raw,{env});
  wasm=result.instance.exports;
  memory=wasm.memory;
  const [lp,ll]=write(lang);
  wasm.start(lp,ll,reduced?1:0,Number(sessionStorage.getItem('uta.sequence')||localStorage.getItem('uta.sequence')||0)|0,remember?1:0);
  wasm.dealloc(lp,ll||1);
  wasm.set_theme(lightTheme?1:0);
  wasm.set_style(renderStyle);
  if(fragment.get('demo')==='1')wasm.demo();
  layout();
  connect();
  const loop=now=>{if(wasm)wasm.frame(now);requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
})().catch(err=>console.error(err));

addEventListener('resize',layout);
if(window.visualViewport)visualViewport.addEventListener('resize',layout);
canvas.addEventListener('pointerdown',e=>{unlock();ptr(0,e);canvas.setPointerCapture(e.pointerId)},{passive:false});
canvas.addEventListener('pointermove',e=>{ptr(1,e);e.preventDefault()},{passive:false});
canvas.addEventListener('pointerup',e=>ptr(2,e));
canvas.addEventListener('pointercancel',e=>ptr(3,e));
canvas.addEventListener('wheel',e=>{if(wasm)wasm.wheel(e.clientX,e.clientY,e.deltaY);e.preventDefault()},{passive:false});
search.addEventListener('input',()=>{if(!wasm)return;const [ptr,len]=write(search.value);wasm.set_search(ptr,len);wasm.dealloc(ptr,len||1)});
search.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
addEventListener('beforeunload',()=>{intentional=true});
</script>
</body>
